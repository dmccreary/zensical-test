# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Migrating from MkDocs to Zensical'
site_description: 'A detailed guide to migrating an mkdocs-material book to the new Zensical system'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/zensical-test/'

# Social preview meta tags (og:image / twitter:image, driven by each page's
# `image:` frontmatter) are implemented as a theme override in
# overrides/main.html, NOT as a `hooks:` entry. `hooks:` (Python
# post-processing) is unsupported under Zensical, but template overrides are
# supported by both builders since they're plain Jinja/MiniJinja -- so this
# one file replaces plugins/social_override.py and works identically on
# `mkdocs build` and `zensical build`. See overrides/main.html for the logic
# and logs/zensical-test.md for how this was verified byte-for-byte across
# both builders. Verify the result with `bk-check-social-cover`.

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/zensical-test'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Why Zensical?: why-zensical.md
  - Migration Steps: migration-steps.md
  - Background on Web Publishing Tools: background-on-web-publishing-tools.md
  - Proposed AGENTS.md Addition: proposed-agents-addition.md
  - Equation Rendering Test (KaTeX): katex-test.md
  
  - MicroSims:
    - List of MicroSims: sims/index.md
    - Bouncing Ball: sims/bouncing-ball/index.md
    - History of Documentation and Publishing Tools: sims/publishing-tools-timeline/index.md
    - ZRX Parallel Build Pipeline: sims/zrx-parallel-build-pipeline/index.md
  
  - References: references.md
  - Glossary: glossary.md
  - Feature Checklist: feature-checklist.md
  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # `variant: classic` tells Zensical to render the Material-for-MkDocs look;
  # mkdocs-material itself ignores this key (harmless under the old builder).
  variant: classic
  # overrides/main.html extends base.html's extrahead block for the social
  # preview meta tags described above. overrides/404.html is the custom
  # error page (Nova the Nautilus, warning pose).
  custom_dir: overrides
  static_templates:
    - 404.html
  
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  logo: img/mascot/welcome.png
  favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
      skip_classes:
        - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Enable KaTeX LaTeX equation rendering
  # Using \(...\) for inline math (currency-safe: plain $20 is never
  # mistaken for math) and $$...$$ or \[...\] for display math.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Custom JavaScript
extra_javascript:
  - js/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

# Exclude prompt scratch files and TODOs from build/search/sitemap.
# NOTE: `exclude_docs` is silently ignored under Zensical as of 0.0.61 (see
# the gap noted in AGENTS.md) -- an uncommented entry here would work under
# `mkdocs build` but give a false impression of working under `zensical
# build`, where these files would still leak into the site. Left commented
# out so this stays documentation of intent rather than a broken filter.
# exclude_docs: |
#   **/image-prompt*.md
#   **/image-prompts*.md
#   **/cover-prompt.md
#   **/cover-image-prompt.md
#   **/TODO.md

# Rebuild on changes during `mkdocs serve`
# NOTE: do not add `mkdocs.yml` to this list. A `watch:` entry matching the
# config file's own name makes Zensical v0.0.61 (and possibly later) silently
# emit zero pages on `zensical build` -- no error, no warning, just an empty
# site/ dir. Reproduced with a minimal repro; see
# https://github.com/zensical/zensical/issues (file a report if unfixed).
# mkdocs itself handles this fine, but the shared config must stay
# dual-compatible, so this entry is left out for both builders.
watch:
  - docs

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Migrating from MkDocs to Zensical'
  textbook_version: '0.1'

  # Google Analytics — property ID: G-6NE4PMF8NV
  analytics:
     provider: google
     property: G-6NE4PMF8NV
